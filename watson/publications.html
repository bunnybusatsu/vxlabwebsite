<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <script>
        // Load the shared head tags
        (async function() {
            try {
                const response = await fetch('../common-head.html'); 
                const htmlText = await response.text();
                document.head.insertAdjacentHTML('afterbegin', htmlText);
                setTimeout(() => { document.body.style.opacity = '1'; }, 50);
            } catch (error) {
                console.error("Failed to load common head tags:", error);
                document.body.style.opacity = '1'; 
            }
        })();
    </script>
    
    <script>
        (async function() {
            try {
                // Assuming header-text.html for the Watson site is kept in the /watson folder
                const response = await fetch('header-text.html'); 
                const htmlText = await response.text();
                
                const headerPlaceholder = document.getElementById('shared-header-text');
                if (headerPlaceholder) {
                    headerPlaceholder.innerHTML = htmlText;
                }
            } catch (error) {
                console.error("Failed to load header text:", error);
            }
        })();
    </script>

    <style> 
        .section-title { font-weight: 700; margin-bottom: 3.5rem; color: #d11a2a; } 
        .section-subtitle { margin-top: -2.5rem; margin-bottom: 3.5rem; font-size: 0.95rem; font-weight: 500; color: #555555; letter-spacing: 0.25em; }
        .section-subtitle a { color: inherit; text-decoration: none; transition: color 0.15s ease; text-transform: uppercase !important; }
        .section-subtitle a:hover { color: #d11a2a; }
        .content-grid { display: grid; grid-template-columns: 1fr; gap: 3.5rem; max-width: 850px; margin: 0 auto; } 
        .grid-item { display: grid; grid-template-columns: 200px 1fr; gap: 2.5rem; align-items: start; } 
        .image-jump-link { display: block; width: 100%; transition: opacity 0.2s ease; }
        .image-jump-link:hover { opacity: 0.85; }
        .item-text-container { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .item-name { margin-bottom: 0.75rem; transition: color 0.15s ease; } 
        .item-description { font-size: 1.02rem; color: #555555; font-weight: 400; line-height: 1.7; text-align: justify; text-transform: none !important; letter-spacing: normal !important; }
        .item-description a { color: #d11a2a; text-decoration: none; font-weight: 600; transition: opacity 0.2s ease; text-transform: none !important; }
        .item-description a:hover { opacity: 0.8; }
        @media (max-width: 768px) { 
            .grid-item { grid-template-columns: 1fr; gap: 1.5rem; justify-items: center; } 
            .item-text-container { align-items: center; text-align: center; } 
        } 
    </style> 
</head> 
<body style="opacity: 0; transition: opacity 0.3s ease;"> 
    <div class="wrapper"> 
        
        <header> 
            <div id="shared-header-text"></div>
        </header> 

        <section id="publications" class="content-section">
            <h2 class="section-title">Publications</h2>
            <div class="section-subtitle">
                <a href="https://scholar.google.com/citations?hl=en&user=yfYYAMQAAAAJ" target="_blank" rel="noopener noreferrer">gscholar</a> &nbsp;|&nbsp; <a href="https://arxiv.org/a/watson_b_1.html" target="_blank" rel="noopener noreferrer">arxiv</a> &nbsp;|&nbsp; <a href="http://go.benjaminwatson.me/pubs" target="_blank" rel="noopener noreferrer">all pubs</a>
            </div>

            <div id="shared-publications-grid" class="content-grid">
            </div>
        </section>

    </div> 

    <script>
        (async function loadSharedPublications() {
            try {
                // 1. Fetch the lab's main publications file
                const response = await fetch('../publications/publications.html');
                if (!response.ok) throw new Error('Network response was not ok');
                const htmlText = await response.text();
                
                // 2. Parse the fetched HTML
                const parser = new DOMParser();
                const sourceDoc = parser.parseFromString(htmlText, 'text/html');
                
                // 3. Find the grid containing the publication items in the fetched file
                const sourceGrid = sourceDoc.querySelector('.content-grid');
                const targetGrid = document.getElementById('shared-publications-grid');
                
                if (sourceGrid && targetGrid) {
                    // 4. Critical Step: Fix relative paths for images!
                    const images = sourceGrid.querySelectorAll('img');
                    images.forEach(img => {
                        const src = img.getAttribute('src');
                        if (src && !src.startsWith('http')) {
                            img.setAttribute('src', '../publications/' + src);
                        }
                    });
                    
                    // 5. Inject the corrected HTML into this page
                    targetGrid.innerHTML = sourceGrid.innerHTML;
                }
            } catch (error) {
                console.error("Failed to load shared publications:", error);
            }
        })();
    </script>
</body> 
</html>
